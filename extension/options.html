<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Research Brief — Extension Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Save to Library</h1>
      <p class="lede">
        Points the extension at your local Research Brief API. Keep the API
        running while you browse.
      </p>

      <form id="settings-form">
        <label>
          API base URL
          <input
            id="apiBaseUrl"
            type="url"
            placeholder="http://127.0.0.1:8000"
            required
          />
        </label>

        <label>
          API token
          <input
            id="apiToken"
            type="password"
            placeholder="Same as LIBRARY_API_TOKEN (optional if empty)"
            autocomplete="off"
          />
        </label>

        <label class="row">
          <input id="downloadImages" type="checkbox" checked />
          Download images into Library/Attachments
        </label>

        <div class="actions">
          <button type="submit">Save settings</button>
          <button type="button" id="test-btn" class="secondary">Test connection</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <section class="help">
        <h2>How to use</h2>
        <ol>
          <li>Start the API: <code>uvicorn app.main:app --app-dir backend --port 8000</code></li>
          <li>Open any article page</li>
          <li>Click the toolbar icon, or right-click → <strong>Save to Library</strong></li>
        </ol>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
