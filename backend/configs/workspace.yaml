# Knowledge Workspace — Obsidian Constitution V1.1
# Cognitive vault roots only: Information / Thinking / Research
# Capture may write readable Information notes. No Inbox. No domain folders.

folders:
  information: Information
  thinking: Thinking
  research: Research
  archive: Archive
  legacy: Archive/Legacy
  digests: Archive/Digests
  meta: 90_Meta
  attachments: Information/Attachments
  # Legacy aliases kept for migration / old paths (not scaffolded as daily IA)
  projects: Projects
  concepts: Concepts
  books: Books
  reflections: Reflections
  insights: Insights
  collections: Collections
  reports: Archive/Digests
  reports_daily: Archive/Digests/Daily
  reports_weekly: Archive/Digests/Weekly
  reports_monthly: Archive/Digests/Monthly
  reports_annual: Archive/Digests/Annual
  reports_special: Archive/Digests/Special Topics

# Cognitive role → vault folder (V1.1)
role_folders:
  information: Information
  thinking: Thinking
  research: Research
  # Legacy workspace_role remaps
  reflection: Thinking
  concept: Thinking
  project: Thinking
  question: Thinking
  book: Information
  insight: Research
  report: Archive/Digests
  archived: Archive

suggestion_threshold: 5

# Tags are optional; do not treat as taxonomy. Empty allowlist = no domain auto-tag enforcement.
filter_tag_allowlist: []

limits:
  max_filter_tags: 3
  max_connections: 8
  max_key_ideas: 12

scaffold_folders: true

# Scaffold only cognitive roots (+ archive/meta/attachments)
scaffold_only:
  - Information
  - Thinking
  - Research
  - Archive
  - Archive/Digests
  - 90_Meta
  - Information/Attachments

thinking:
  reflection_freeform: true
  preserve_existing_reflection_files: true
  preserve_human_notes_on_sync: true

# Notion → Obsidian Thinking Vault (property-column contract)
thinking_vault:
  folder: Thinking
  archive_folder: Archive/Thinking
  property_names:
    title: Name
    status: Status
    raw_thought: Raw Thought
    context: Context
    observation: Observation
    interpretation: Interpretation
    uncertainty: Uncertainty
    questions: Questions
    later_reflection: Later Reflection
    related_information: Related Information
    tags: Tags
