# Knowledge Lifecycle Engine configuration

# Connectors that skip ephemeral signal stage (enter as resource)
skip_signal_connectors:
  - pubmed
  - manual

# Connectors that enter as signal (filterable)
signal_connectors:
  - rss
  - web
  - wechat
  - email

signal_ttl_hours: 168  # 7 days

auto_mature: false  # human confirms maturity bumps by default

maturity_thresholds:
  candidate: 20
  emerging: 40
  stable: 65
  core: 85

score_weights:
  mention_count: 0.25
  reflection_count: 0.25
  resource_count: 0.20
  project_count: 0.15
  persistence_days: 0.10
  ai_confidence: 0.05

score_norms:
  mention_count: 20
  reflection_count: 10
  resource_count: 15
  project_count: 5
  persistence_days: 90

proposal_min_score: 20

# AI decision points
ai:
  filter_signals_on_evaluate: true
  suggest_questions_on_reflection: true
  use_llm_when_configured: true

# Insight vault (off by default; enable explicitly)
sync_insights_to_vault: false
insight_vault_folder: Insights

# When sync_insights_to_vault is true, also register Insights/ in workspace scaffold
# via workspace.yaml folders.insights — kept here as Lifecycle authority.
