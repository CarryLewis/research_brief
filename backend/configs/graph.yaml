# Knowledge Graph Engine — cognitive projection (not visualization)

# Node weight formula inputs (norms = soft ceilings)
weight_weights:
  reflection_degree: 0.20
  project_degree: 0.15
  connection_degree: 0.15
  recency: 0.15
  evidence: 0.15
  insight_contribution: 0.10
  maturity_prior: 0.10

weight_norms:
  reflection_degree: 10
  project_degree: 5
  connection_degree: 20
  recency_days: 90

maturity_prior:
  candidate: 0.2
  emerging: 0.4
  stable: 0.7
  core: 1.0
  deprecated: 0.1

insight_base_boost: 15
open_question_boost: 10
answered_question_decay: 0.5

# Named views: node_type allowlists
views:
  concept:
    node_types: [concept]
  research:
    node_types: [project, concept, question]
  reflection:
    node_types: [reflection, concept]
  insight:
    node_types: [insight, concept, project]
  reading:
    node_types: [book, concept]
  timeline:
    node_types: [concept, project, question, insight, reflection]
  governance:
    node_types: [concept, project, question, insight, reflection]
  default:
    node_types: [concept, project, question, insight]
    reflection_min_degree: 1
  full_thinking:
    node_types: [concept, project, question, insight, reflection]
  with_resources:
    node_types: [concept, project, question, insight, reflection, book, resource]

# Auto-sync after lifecycle mutations
auto_sync_on_mutate: true

metrics_window_days: 30
