# Knowledge Graph Engine — cognitive projection (Constitution V1.1)
# Objective: meaningful connectivity between Information / Thinking / Research
# objects — not maximum density, not infrastructure graphs.
# AI link suggestions are propose-only (human accept required).

# Node weight formula inputs (norms = soft ceilings)
weight_weights:
  reflection_degree: 0.20
  project_degree: 0.15
  connection_degree: 0.15
  recency: 0.15
  evidence: 0.15
  insight_contribution: 0.10
  maturity_prior: 0.10

weight_norms:
  reflection_degree: 10
  project_degree: 5
  connection_degree: 20
  recency_days: 90

maturity_prior:
  candidate: 0.2
  emerging: 0.4
  stable: 0.7
  core: 1.0
  deprecated: 0.1

insight_base_boost: 15
open_question_boost: 10
answered_question_decay: 0.5

# Named views: node_type allowlists
# Cognitive defaults exclude resources/reports/infrastructure.
views:
  default:
    node_types: [information, thinking, research, concept, reflection, question, insight, project, book]
    reflection_min_degree: 0
  cognitive:
    node_types: [information, thinking, research, concept, reflection, question, insight, project, book]
  information:
    node_types: [information, book]
  thinking:
    node_types: [thinking, reflection, concept, question, project]
  research:
    node_types: [research, insight, concept, project, question]
  # Legacy / debug views
  concept:
    node_types: [concept]
  reflection:
    node_types: [reflection, thinking, concept]
  insight:
    node_types: [insight, research, concept, project]
  reading:
    node_types: [book, information, concept]
  timeline:
    node_types: [concept, project, question, insight, reflection, thinking, research, information]
  full_thinking:
    node_types: [concept, project, question, insight, reflection, thinking]
  full_cognitive:
    node_types: [information, thinking, research, concept, project, question, insight, reflection, book]
  with_resources:
    node_types: [concept, project, question, insight, reflection, thinking, research, book, information, resource]
  governance:
    node_types: [concept, project, question, insight, reflection, thinking]

# Never materialize these as cognitive graph nodes merely because they exist
exclude_infrastructure_labels:
  - Information
  - Thinking
  - Research
  - Database
  - Resource
  - Workspace
  - Pipeline
  - API
  - Template
  - Status
  - Content Lake
  - Inbox

# Auto-sync after lifecycle mutations
auto_sync_on_mutate: true

# Link suggestions must remain propose-only
auto_accept_link_suggestions: false

metrics_window_days: 30
