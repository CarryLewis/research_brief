# Thinking Vault — scheduled Notion → vault sync (GitHub Actions)
#
# Required repository secrets:
#   NOTION_TOKEN
#   NOTION_THINKING_DATABASE_ID

name: Thinking Vault Sync

on:
  schedule:
    # Every hour (UTC). Adjust as needed.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      soft_archive_missing:
        description: Soft-archive vault notes missing from Notion
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: thinking-vault-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Restore Thinking sync SQLite cache
        uses: actions/cache@v4
        with:
          path: data/research_brief.db
          key: thinking-sync-db-${{ github.ref_name }}
          restore-keys: |
            thinking-sync-db-

      - name: Run Notion → vault sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_THINKING_DATABASE_ID: ${{ secrets.NOTION_THINKING_DATABASE_ID }}
          DEFAULT_VAULT_PATH: ${{ github.workspace }}/vault
          DATA_DIR: ${{ github.workspace }}/data
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          if [ -z "${NOTION_TOKEN:-}" ] || [ -z "${NOTION_THINKING_DATABASE_ID:-}" ]; then
            echo "Missing secrets NOTION_TOKEN and/or NOTION_THINKING_DATABASE_ID" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.soft_archive_missing }}" != "true" ]; then
            python -m app.cli.thinking_sync --vault "$DEFAULT_VAULT_PATH" --no-archive-missing
          else
            python -m app.cli.thinking_sync --vault "$DEFAULT_VAULT_PATH"
          fi

      - name: Commit vault changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vault
          if git diff --staged --quiet; then
            echo "No vault changes to commit."
            exit 0
          fi
          git commit -m "chore(thinking): sync Notion Thinking Vault [skip ci]"
          git push
